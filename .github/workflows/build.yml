
name: Java Application Build and Kubernetes Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Maven Clean Package
        run: mvn clean package

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/bookstore-backend:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/bookstore-backend:${{ github.sha }}

      - name: Configure Kubernetes
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Check Kubernetes Connection
        run: kubectl get nodes

      
      - name: Configure Kubernetes
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "KUBE_CONFIG secret is empty or unavailable."
            exit 1
          fi

          mkdir -p "$HOME/.kube"

          printf '%s' "$KUBE_CONFIG_B64" \
            | base64 --decode > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          kubectl config current-context
          kubectl get nodes

       
