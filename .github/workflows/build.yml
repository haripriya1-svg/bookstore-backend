
name: Java Application Build and Kubernetes Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Maven Clean Package
        run: mvn clean package

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/bookstore-backend:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/bookstore-backend:${{ github.sha }}

      - name: Configure Kubernetes
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Check Kubernetes Connection
        run: kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deploy.yml
          kubectl apply -f k8s/service.yml

          kubectl set image deployment/my-app-deployment \
            my-app-container=${{ secrets.DOCKER_USERNAME }}/bookstore-backend:${{ github.sha }}

          kubectl rollout status deployment/my-app-deployment --timeout=180s

      - name: Verify Deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
